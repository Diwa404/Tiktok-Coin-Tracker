<!DOCTYPE html>
<html>
<head>
  <title>TikTok Coin Tracker</title>
</head>
<body>
  <h1>TikTok Coin Tracker</h1>
  <p>Enter the number of coins you have received:</p>
  <input type="number" id="coins" min="0" />
  <button onclick="calculateValue()">Calculate Value</button>
  <p id="result"></p>

  <script>
    // Assume 1 coin = $0.05 (example rate)
    function calculateValue() {
      const coins = parceFloat(document.getElementById('coins').value);
      if (isNaN('coins') || coins < 0) {
        alert('Please enter a valid number of coins.');
        return;
      }
      const value = coins * 0.05;
      document.getElementById('result').innerText = `Estimated value: $${value.toFixed(2)}`;
    }
  </script>
</body>
</html>
